<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 262" width="200" height="262" role="img" aria-labelledby="vt vd">
  <title id="vt">Vitorio</title>
  <desc id="vd">Moai dourado em busto, sem olhos, nariz bulboso, queixo longo. Desenho de referência aprovado em 30/10/2026.</desc>
  <!--
    Referência geométrica aprovada para o mascote Vitorio.
    Grupos com id servem de alvo para as animações:
    #vitorio-corpo (flutuação), #vitorio-cabeca (inclinação no estado "nada"),
    #vitorio-sobrancelha (sobe levemente no estado "respondendo"),
    #vitorio-boca (escala vertical no estado "respondendo"), #vitorio-brilho (reflexo que atravessa).
    No app, as faixas planas de luz podem virar gradientes suaves, mantendo a silhueta.
  -->
  <defs>
    <clipPath id="vitorio-clip-cabeca">
      <path d="M66 42 C66 30 74 26 100 26 C126 26 134 30 134 42 L138 150 L140 200 C140 214 128 220 100 220 C72 220 60 214 60 200 L62 150 Z"/>
    </clipPath>
  </defs>
