        <rect x="90" y="20" width="22" height="210" fill="#E6BA44"/>
        <rect x="124" y="20" width="22" height="210" fill="#A87A16"/>
        <polygon id="vitorio-brilho" points="52,0 66,0 30,262 16,262" fill="#FFF0BE"/>
      </g>
      <path d="M66 42 C66 30 74 26 100 26 C126 26 134 30 134 42 C118 37 82 37 66 42 Z" fill="#ECC659"/>
